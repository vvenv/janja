name: NPM publish
permissions:
  id-token: write
  contents: read

on:
  release:
    types: [created]
  workflow_dispatch:

# Never cancel a publish half way through
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Update npm
        run: npm install -g npm@latest
      # Publishes every workspace package whose version is not on npm yet and
      # replaces `workspace:*` ranges with real versions
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
