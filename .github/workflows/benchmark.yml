name: Performance Benchmark
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      # What the change is compared with: the branch a pull request targets,
      # or the commit that `main` was at before a push
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        run: pnpm --filter janja bench --outputJson "$RUNNER_TEMP/head.json"
      # Runners are not equally fast, so results of an earlier run say little.
      # The base is measured here, right after the change and on this machine.
      - name: Check out the base
        id: base
        run: |
          if git fetch --depth=1 origin "$BASE" && git worktree add "$RUNNER_TEMP/base" FETCH_HEAD; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Base commit $BASE is not available, nothing to compare with"
          fi
      - name: Run benchmarks of the base
        if: steps.base.outputs.found
        working-directory: ${{ runner.temp }}/base
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter janja bench --outputJson "$RUNNER_TEMP/base.json"
      - name: Compare
        if: steps.base.outputs.found
        run: node packages/janja/scripts/benchmark-compare.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"
