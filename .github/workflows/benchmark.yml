name: Performance Benchmark
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        run: pnpm --filter janja bench --outputJson benchmark-raw.json
      - name: Convert results
        run: node packages/janja/scripts/benchmark-results.mjs packages/janja/benchmark-raw.json benchmark-results.json
      # Results of `main` are kept in the Actions cache and pull requests are
      # compared against them. The first run has nothing to compare with.
      - name: Restore the results of main
        uses: actions/cache/restore@v4
        with:
          path: ./benchmark-cache
          key: benchmark-data-${{ github.run_id }}
          restore-keys: benchmark-data-
      - name: Compare benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customBiggerIsBetter
          output-file-path: benchmark-results.json
          external-data-json-path: ./benchmark-cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@vvenv'
      - name: Save the results of main
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ./benchmark-cache
          key: benchmark-data-${{ github.run_id }}
